<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102d50"><title>Istifada1448H · Quiz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="participant">
<header class="site-header"><div class="brand"><span class="brand-mark">✦</span><span>Istifada1448H</span></div><nav><a class="active" href="index.html">Participant</a><a href="presenter.html">Presenter</a><a href="audience.html">Audience</a></nav></header>
<main class="shell">
<section class="hero"><p class="eyebrow">TaweeliyaNikat RasailShareefa</p><h1>Learn, reflect, and share.</h1><p>Enter your Mumin ID to access today’s workshop activities.</p></section>
<section class="card" id="participant-panel"><div class="section-heading"><div><span class="step">01</span><h2>Find your profile</h2></div></div>
<form id="participant-form" class="inline-form"><label for="mumin-id">Participant details</label><div class="search-row"><input id="mumin-id" name="muminId" required inputmode="numeric" autocomplete="off" placeholder="Enter Mumin ID / ITS"><input id="search-name" name="name" placeholder="Name (optional)" autocomplete="name"><button class="btn primary" type="submit">Search</button></div></form>
<div id="participant-message" class="message hidden" role="status"></div><div id="profile" class="profile hidden"></div></section>
<section id="actions" class="card hidden"><div class="section-heading"><div><span class="step">02</span><h2>Choose an activity</h2></div></div><div class="action-grid"><button id="start-quiz" class="action-card" type="button"><span class="action-icon">✎</span><strong>Take today's quiz</strong><small>Answer the daily questions</small></button><button id="ask-question" class="action-card" type="button"><span class="action-icon">?</span><strong>Ask a question</strong><small>Share with the presenter</small></button></div></section>
<section id="quiz-section" class="card hidden"><div id="quiz-root"></div></section>
<section id="question-section" class="card hidden"><div class="section-heading"><div><span class="step">03</span><h2>Ask a question</h2></div></div><form id="audience-form" class="form-grid"><label>Question type<select id="question-type"><option value="Text">Text</option><option value="Picture">Picture</option></select></label><label class="full">Question<textarea id="question-text" rows="5" required></textarea></label><label id="question-image-wrap" class="full hidden">Image<input id="question-image" type="file" accept="image/*"><small>Images are securely uploaded through the backend.</small></label><div class="full form-actions"><button id="cancel-question" class="btn ghost" type="button">Cancel</button><button class="btn primary" type="submit">Submit question</button></div><div id="question-message" class="message full hidden" role="status"></div></form></section>
</main>
<footer><span id="participant-footer-name">Participant portal</span> · Istifada1448H</footer>
<script src="js/config.js"></script><script src="js/utils.js"></script><script src="js/api.js"></script><script src="js/quiz.js"></script><script src="js/participant.js"></script>
</body></html>
